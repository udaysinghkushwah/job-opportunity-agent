version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/job_opportunity_agent
      - LLM_PROVIDER=mock
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    container_name: job_agent_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: job_agent_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
